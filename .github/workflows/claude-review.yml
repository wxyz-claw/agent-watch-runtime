name: Claude PR review

# Automatic review when a pull request opens or gets new commits, and an
# on-demand assistant when the owner mentions @claude on a PR or issue.
# Needs the Claude GitHub App on this repository and a CLAUDE_CODE_OAUTH_TOKEN
# (or ANTHROPIC_API_KEY) repository secret.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    # Fork PRs get no secrets, so only review branches of this repository.
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness.

            Before reading the diff, read AGENTS.md, CLAUDE.md and LESSONS.md
            at the repository root if they exist. LESSONS.md lists mistakes
            this repository has made before, each with a check or signal.
            Apply every lesson whose check matches the diff, and name the
            lesson when a finding comes from one.

            Report only real problems: bugs, regressions, broken invariants,
            missing or weakened tests, security or privacy issues, and
            violations of the repository's own rules. Skip style nits and
            restating what the diff does. Put each finding in an inline
            comment on the line it concerns, with the concrete failure it
            causes.

            Finish with exactly one verdict review on the PR. First re-read
            the PR head with
              gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json headRefOid
            and stop without a verdict if it is no longer
            ${{ github.event.pull_request.head.sha }}. Otherwise run
              gh pr review ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --approve --body "<summary>"
            when you found no blocking problems, or the same command with
            --request-changes instead of --approve when you did. The summary
            lists the blocking findings, or says plainly that you found none.
            Never approve a head you did not review, and never approve to
            test this workflow.

            This is a public repository. Its runtime must stay on the Node
            standard library with zero dependencies. Test fixtures must be
            fabricated, so flag anything that looks like real personal data,
            private paths, credentials or tokens, and never quote such values
            in a comment. Store schema changes need an upgrade path and a
            test that opens the previous version.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review ${{ github.event.pull_request.number }} --repo ${{ github.repository }}:*),Read,Grep,Glob"

  mention:
    # Only the repository owner can summon Claude with @claude.
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        github.event.review.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
