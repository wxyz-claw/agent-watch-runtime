name: Watch runtime checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static and privacy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
      - run: node scripts/check-static.mjs --tracked

  node22:
    name: Node 22.13.0
    uses: ./.github/workflows/runtime.yml
    with:
      node-version: '22.13.0'

  node24:
    name: Node 24
    uses: ./.github/workflows/runtime.yml
    with:
      node-version: '24.x'

  node26:
    name: Node 26
    uses: ./.github/workflows/runtime.yml
    with:
      node-version: '26.x'

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [static, node22, node24, node26]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require all four job results
        env:
          WATCH_CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-static.mjs --quality-gate
